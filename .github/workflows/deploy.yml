name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: python -m pip install jsonschema pyyaml pytest fastapi httpx uvicorn

      - name: Run harness verification
        run: python -m pytest cascade/tests/ -q

      - name: Check the committed mock ledger is up to date
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          subprocess.run([
              sys.executable, "cascade/src/replay.py",
              "--out", "/tmp/mock_ledger.json",
              "--md-out", "/tmp/mock_ledger.md",
              "--web-out", "/tmp/web_ledger.json",
          ], check=True)

          pairs = [
              ("data/eval/mock_ledger.json", "/tmp/mock_ledger.json"),
              ("web/data/ledger.json", "/tmp/web_ledger.json"),
          ]
          for committed_path, fresh_path in pairs:
              committed = json.load(open(committed_path, encoding="utf-8"))
              fresh = json.load(open(fresh_path, encoding="utf-8"))
              assert committed == fresh, (
                  f"{committed_path} is stale; run python3 cascade/src/replay.py"
              )
          print("mock ledger is up to date")
          PY

      - name: Verify web metric formulas match the Python ledger
        run: node cascade/tests/verify_web_metrics.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
