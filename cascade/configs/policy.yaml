# policy.yaml — Routing and cascade policy for the demo.
#
# All values are deterministic inputs, not learned parameters. The confidence
# values are illustrative estimates of how sure the small model is on each
# difficulty band; a real deployment should replace them with measured
# confidence from the small model (e.g. logprob margin or self-consistency).

# cascade escalation mode: "confidence" (default, rule or model-reported mean
# token probability), "verifier_first" (accept on deterministic-verifier pass,
# escalate on deterministic-verifier failure, fall back to confidence when the
# task has no verifier), or "verifier_strict" (also escalate every unverifiable
# task). The mock ledger stays on "confidence" so existing numbers do not move;
# real evaluation switches this flag at runtime.
escalation_mode: confidence

confidence_threshold: 0.66

# Base confidence of the small model by expected difficulty. This is the
# deterministic *prior*: a real backend that returns token log-probabilities
# replaces it with the model-reported confidence before escalation.
confidence_by_difficulty:
  low: 0.93
  medium: 0.78
  high: 0.52

# Maximum attempts per policy. Fixed policies retry their own model on
# failure; cascade escalates instead of retrying the small model.
max_attempts:
  all_frontier: 1
  all_small: 2
  cascade: 1

# Synthetic task flow composition (F1.5 / F2.5). The distribution is driven
# by task_class because that is what determines whether escalation can ever
# help: should_refuse tasks must not be "solved" by inventing input,
# small_sufficient tasks are cheap wins, frontier_required tasks need the
# frontier model.
task_class_mix:
  should_refuse: 20
  small_sufficient: 50
  frontier_required: 30

# Kind (difficulty) weights inside each class. They are scaled to the class
# total; at 100 tasks this keeps the overall kind mix at 50/30/20.
task_class_kind_mix:
  should_refuse:
    simple: 1
    medium: 1
  small_sufficient:
    simple: 4
    medium: 1
  frontier_required:
    medium: 1
    complex: 2
